name: Build and Push Runner Image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-runner.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/build-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: slim
            tag-suffix: "-slim"
            flavor-latest: "false"
            raw-tag: slim
            sha-prefix: slim-
            cache-from: "type=gha,scope=slim"
            cache-to: "type=gha,mode=max,scope=slim"
          - target: full
            tag-suffix: ""
            flavor-latest: "true"
            raw-tag: latest
            sha-prefix: ""
            cache-from: |
              type=gha,scope=full
              type=gha,scope=slim
            cache-to: "type=gha,mode=max,scope=full"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Name to Lowercase
        id: image-name
        run: |
          RAW_IMAGE="ghcr.io/${{ github.repository }}"
          echo "image=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Tag strategy:
      # - Full image: :latest, :<sha>; tag vX.Y.Z -> :vX.Y.Z + :latest
      # - Slim image: :slim, :slim-<sha>; tag vX.Y.Z -> :vX.Y.Z-slim + :slim
      - name: Generate Docker Image Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          flavor: |
            latest=${{ matrix.flavor-latest }}
          tags: |
            type=raw,value=${{ matrix.raw-tag }}
            type=ref,event=tag,suffix=${{ matrix.tag-suffix }}
            type=sha,prefix=${{ matrix.sha-prefix }},format=long

      - name: Build Docker Image (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.image-name.outputs.image }}:ci-smoke-test-${{ matrix.target }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}

      - name: Smoke-test CLI in built slim image
        if: matrix.target == 'slim'
        run: |
          docker run --rm \
            "${{ steps.image-name.outputs.image }}:ci-smoke-test-slim" \
            sh -c '
              git --version &&
              gh --version &&
              curl --version &&
              python -m gitemployed.cli.respond --help
            '

      # Guards against the exact class of regression this image is prone to:
      # a `oven/bun:latest` bump, a Debian `chromium` point release, or a
      # `resumed`/Puppeteer update silently breaking the hand-verified
      # invocation contract documented in the Dockerfile (privilege-dropped
      # `pptruser`, `--puppeteer-arg=--no-sandbox`, the apt-installed
      # Chromium path). `docker build` succeeding proves none of that; only
      # actually running `resumed export` does.
      - name: Smoke-test tools in built full image
        if: matrix.target == 'full'
        run: |
          docker run --rm \
            -v "$PWD/.github/fixtures:/work" -w /work \
            "${{ steps.image-name.outputs.image }}:ci-smoke-test-full" \
            sh -c '
              su -s /bin/sh pptruser -c "pdf-vdiff --help" &&
              su -s /bin/sh pptruser -c "bun /opt/bun/bin/resumed export resume.json -t @jsonresume/jsonresume-theme-professional -o /tmp/resume.pdf --puppeteer-arg=--no-sandbox" &&
              [ -s /tmp/resume.pdf ]
            '

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}
